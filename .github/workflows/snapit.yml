name: /snapit

on:
  issue_comment:
    types:
      - created

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  snapit:
    name: /snapit
    if: github.event.issue.pull_request && github.event.comment.body == '/snapit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.7.0

      - name: Create snapshot
        uses: Shopify/snapit@efd7ad2bbc01ba82ac9a8495eb49b3a8eed0d9b9 # v0.1.0
        env:
          # v0.1.0 reads comment_command although its metadata declares trigger_comment.
          INPUT_COMMENT_COMMAND: '/snapit'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep both empty so npm uses OIDC instead of token authentication.
          NPM_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
